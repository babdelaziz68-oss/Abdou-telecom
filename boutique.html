<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdou Telecom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#14202b;--mut:#5d6b78;--acc:#2f5bff;--line:#e2e6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#10171e;--card:#18222c;--ink:#eef2f6;--mut:#93a1ae;--acc:#6f8cff;--line:#2a3743}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.cartbtn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 16px;font-weight:600}
.chips{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:4px 16px 32px;max-width:960px;margin:0 auto}
.p{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{aspect-ratio:1;background:#fff}.ph img{width:100%;height:100%;object-fit:cover;display:block}.it img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.pn{font-weight:600}
.pc{color:var(--mut);font-size:13px}
.pr{font-weight:800;margin-top:auto;padding-top:6px}
.add{margin-top:8px;border:0;background:var(--acc);color:#fff;border-radius:10px;padding:8px;font-weight:600}
aside{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:10;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
aside.open{transform:none}
.ah{display:flex;justify-content:space-between;align-items:center}
.ah h2{margin:0;font-size:20px}
.close{background:none;border:0;font-size:26px;color:var(--ink)}
#items{flex:1;overflow-y:auto;margin:12px 0}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it .e{font-size:28px}
.it .t{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink)}
.empty{color:var(--mut);padding:24px 0;text-align:center}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:12px}
.order{width:100%;border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px;font-weight:800}
.order:disabled{opacity:.4}
.ok{color:var(--acc);font-weight:600;text-align:center;margin-top:10px;min-height:1.4em}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<header><h1>Abdou Telecom</h1><button class="cartbtn" id="open">Panier (<span id="n">0</span>)</button></header>
<div class="chips" id="chips"></div>
<main id="grid"></main>
<aside id="cart" aria-label="Panier">
  <div class="ah"><h2>Votre panier</h2><button class="close" id="close" aria-label="Fermer">×</button></div>
  <div id="items"></div>
  <div class="tot"><span>Total</span><span id="total">0,00 €</span></div>
  <button class="order" id="order">Commander sur WhatsApp</button>
  <div class="ok" id="ok" role="status"></div>
</aside>

const eur=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f")+" FCFA";
let cat="Tout",panier={};
const $=id=>document.getElementById(id);
function chips(){const cs=["Tout",...new Set(PRODUITS.map(p=>p.cat))];
$("chips").innerHTML=cs.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");}
function grille(){$("grid").innerHTML=PRODUITS.filter(p=>cat==="Tout"||p.cat===cat).map(p=>
`<div class="p"><div class="ph"><img src="${p.img}" alt="${p.nom}"></div><div class="pb"><div class="pn">${p.nom}</div><div class="pc">${p.cat}</div><div class="pr">${eur(p.prix)}</div><button class="add" data-a="${p.id}">Ajouter au panier</button></div></div>`).join("");}
function rendu(){const ids=Object.keys(panier);let tot=0,n=0;
$("items").innerHTML=ids.length?ids.map(id=>{const p=PRODUITS.find(x=>x.id==id),q=panier[id];tot+=p.prix*q;n+=q;
return `<div class="it"><img src="${p.img}" alt=""><div class="t"><div>${p.nom}</div><div class="pc">${eur(p.prix)}</div></div><div class="q"><button data-m="${id}" aria-label="Retirer un">−</button>${q}<button data-p="${id}" aria-label="Ajouter un">+</button></div></div>`}).join(""):'<div class="empty">Votre panier est vide. Ajoutez un produit pour commencer.</div>';
$("total").textContent=eur(tot);$("n").textContent=n;$("order").disabled=!n;}
document.addEventListener("click",e=>{const t=e.target;
if(t.dataset.c){cat=t.dataset.c;chips();grille();}
if(t.dataset.a||t.dataset.p){const id=t.dataset.a||t.dataset.p;panier[id]=(panier[id]||0)+1;$("ok").textContent="";rendu();}

});
$("open").onclick=()=>$("cart").classList.add("open");

$("order").onclick=()=>{
const l=Object.keys(panier).map(id=>{const p=PRODUITS.find(x=>x.id==id);return "- "+panier[id]+" x "+p.nom+" ("+eur(p.prix*panier[id])+")";});
const tot=Object.keys(panier).reduce((a,id)=>a+PRODUITS.find(x=>x.id==id).prix*panier[id],0);
const msg="Bonjour Abdou Telecom, je voudrais commander :\n"+l.join("\n")+"\nTotal : "+eur(tot);
window.open("https://wa.me/237655861520?text="+encodeURIComponent(msg),"_blank");
panier={};rendu();$("ok").textContent="Ouverture de WhatsApp pour envoyer votre commande.";};
chips();grille();rendu();
</script>
